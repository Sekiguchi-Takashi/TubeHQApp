name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build both APKs
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect
        run: |
          mkdir -p out
          cp desk/build/outputs/apk/release/*.apk out/TubeDesk.apk
          cp cut/build/outputs/apk/release/*.apk out/TubeCut.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TubeHQApp-apk
          path: out/*.apk
